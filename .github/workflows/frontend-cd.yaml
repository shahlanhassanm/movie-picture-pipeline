name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/frontend/**'
  workflow_dispatch:

env:
  NODE_VERSION: '18.14'
  FRONTEND_DIR: starter/frontend
  AWS_REGION: us-east-1
  ECR_REPOSITORY: frontend
  EKS_CLUSTER_NAME: cluster

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('starter/frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Run lint
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('starter/frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Run tests
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          CI: true
        run: npm test

  build-and-deploy:
    name: Build and Deploy
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configure kubectl for EKS
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      # The React bundle is compiled with the API URL baked in at build time, so the
      # backend's public address has to be resolved before the image is built. Prefer
      # the live LoadBalancer on the cluster; fall back to the repository variable.
      - name: Resolve backend API URL
        id: api
        run: |
          HOST=$(kubectl get svc backend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
          if [ -n "$HOST" ]; then
            URL="http://$HOST"
          else
            URL="${{ vars.REACT_APP_MOVIE_API_URL }}"
          fi
          if [ -z "$URL" ]; then
            echo "::error::Could not resolve the backend API URL. Deploy the backend first, or set the REACT_APP_MOVIE_API_URL repository variable."
            exit 1
          fi
          echo "Using backend API URL: $URL"
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Build and push image to ECR
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          REACT_APP_MOVIE_API_URL: ${{ steps.api.outputs.url }}
        run: |
          docker build \
            --build-arg=REACT_APP_MOVIE_API_URL=$REACT_APP_MOVIE_API_URL \
            --tag=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Ensure kustomize is available
        run: |
          if ! command -v kustomize >/dev/null 2>&1; then
            curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" | tar -xz -C /tmp
            sudo install -m 0755 /tmp/kustomize /usr/local/bin/kustomize
          fi
          kustomize version

      - name: Deploy to Kubernetes
        working-directory: ${{ env.FRONTEND_DIR }}/k8s
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kustomize edit set image frontend=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          kustomize build | kubectl apply -f -

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/frontend --timeout=300s
          kubectl get svc frontend
